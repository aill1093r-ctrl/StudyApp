name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          echo "⏱️ [1/3] Installing System Dependencies..."
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip ccache openjdk-17-jdk

      - name: Install Python dependencies
        run: |
          echo "⏱️ [2/3] Installing Buildozer & Cython..."
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Setup Android SDK Environment & Build
        run: |
          echo "⏱️ [3/3] Compiling Android APK..."
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH
          
          # Accept SDK licenses automatically
          yes | sdkmanager --licenses || true
          
          # Build APK
          export CI=true
          buildozer android debug

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StudyApp-APK
          path: bin/*.apk

      - name: Print Build Logs on Failure
        if: failure()
        run: |
          echo "=== BUILDOZER LOGS ==="
          cat .buildozer/android/platform/build-*/build.log || echo "No build log found"
